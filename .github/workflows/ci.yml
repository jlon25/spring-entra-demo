name: Maven verification

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Java 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Verify
        run: ./mvnw --batch-mode --no-transfer-progress verify
      - name: Verify local identity simulator
        run: python3 -m unittest discover -s dev -p "test_*.py" -v

  compose-smoke:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      COMPOSE_PROJECT_NAME: ci-jwt
      API_PORT: '18080'
      IDENTITY_PORT: '19000'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Build and wait for healthy containers
        run: docker compose up --build --wait --wait-timeout 180
      - name: Verify API and identity provider over HTTP
        env:
          API_BASE_URL: http://127.0.0.1:18080
          IDENTITY_BASE_URL: http://127.0.0.1:19000
        run: python3 dev/compose_smoke.py
      - name: Clean up containers and volumes
        if: always()
        run: docker compose down --volumes --remove-orphans
