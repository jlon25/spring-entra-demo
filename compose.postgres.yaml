# Opt in with: docker compose -f compose.yaml -f compose.postgres.yaml ...
# Start postgres, run dev/postgres_prepare.sh, then start the complete stack.
services:
  api:
    environment:
      SPRING_PROFILES_ACTIVE: postgres
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-auditions}?currentSchema=auditions
      SPRING_DATASOURCE_USERNAME: auditions_app
      SPRING_DATASOURCE_PASSWORD: ${APP_DB_PASSWORD:?Set APP_DB_PASSWORD in .env for the PostgreSQL override}
      SPRING_FLYWAY_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-auditions}?currentSchema=auditions
      SPRING_FLYWAY_USER: auditions_migrator
      SPRING_FLYWAY_PASSWORD: ${DB_MIGRATION_PASSWORD:?Set DB_MIGRATION_PASSWORD in .env for the PostgreSQL override}
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    # Explicit supported patch; official image tag, not an immutable digest.
    image: postgres:18.6-bookworm
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-auditions}
      # Bootstrap administrator only. Do not use this account for the future API.
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env for the PostgreSQL override}
      POSTGRES_HOST_AUTH_METHOD: scram-sha-256
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
      # Used only by the explicit prepare command, including on existing volumes.
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?Set APP_DB_PASSWORD in .env for the PostgreSQL override}
      DB_MIGRATION_PASSWORD: ${DB_MIGRATION_PASSWORD:?Set DB_MIGRATION_PASSWORD in .env for the PostgreSQL override}
    volumes:
      # PostgreSQL 18+ uses PGDATA=/var/lib/postgresql/18/docker.
      - postgres_data:/var/lib/postgresql
    # No host port: PostgreSQL is reachable only on the Compose network.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      start_period: 20s
      retries: 12
    # The official entrypoint prepares ownership, then runs PostgreSQL as postgres.
    # Do not force the API's UID or remove the capabilities needed for first init.
    read_only: true
    tmpfs:
      - /var/run/postgresql:rw,noexec,nosuid,size=16m,mode=3775
      - /tmp:rw,noexec,nosuid,size=16m,mode=1777
    shm_size: 128mb
    security_opt: [no-new-privileges:true]
    restart: unless-stopped

volumes:
  postgres_data:

