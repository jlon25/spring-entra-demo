# Never enable local identity implicitly; combine postgres,local only for native development.
spring.autoconfigure.exclude=
spring.datasource.url=${APP_DB_URL}
spring.datasource.username=auditions_app
spring.datasource.password=${APP_DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=5
spring.flyway.url=${APP_DB_URL}
spring.flyway.user=auditions_migrator
spring.flyway.password=${DB_MIGRATION_PASSWORD}
spring.flyway.default-schema=auditions
spring.flyway.schemas=auditions
spring.flyway.create-schemas=false
spring.flyway.clean-disabled=true
spring.flyway.baseline-on-migrate=false
spring.jackson.deserialization.accept-float-as-int=false
spring.jackson.mapper.allow-coercion-of-scalars=false
spring.jackson.deserialization.fail-on-unknown-properties=true
