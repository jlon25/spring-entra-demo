spring.application.name=spring-entra-demo
app.security.jwt.issuer=${JWT_ISSUER_URI}
app.security.jwt.jwk-set-uri=${JWT_JWK_SET_URI}
app.security.jwt.audience=${JWT_AUDIENCE}


# PostgreSQL is opt-in; existing JWT-only execution remains available.
spring.autoconfigure.exclude=org.springframework.boot.jdbc.autoconfigure.DataSourceAutoConfiguration,org.springframework.boot.flyway.autoconfigure.FlywayAutoConfiguration
